<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Fill System - Quản Trị Hệ Thống</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { 
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #f1f5f9 0%, #e2e8f0 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 24px 50px -12px rgba(15, 23, 42, 0.14), 0 0 0 1px rgba(0, 0, 0, 0.02);
      max-width: 400px;
      width: 100%;
      padding: 34px 30px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: afFadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes afFadeUp {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .logo-badge {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.4);
      margin-bottom: 8px;
    }

    .login-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.025em;
    }

    .login-subtitle {
      font-size: 13px;
      color: #64748b;
      line-height: 1.45;
      font-weight: 500;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: #334155;
    }

    .form-link {
      font-size: 11.5px;
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s;
    }
    .form-link:hover {
      color: #059669;
      text-decoration: underline;
    }

    .input-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 13px;
      color: #94a3b8;
      pointer-events: none;
      transition: color 0.2s ease;
      z-index: 2;
    }

    .input-wrap:focus-within .input-icon {
      color: #10b981;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background-color: #f8fafc;
      color: #0f172a;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .form-input:focus {
      background-color: #ffffff;
      border-color: #10b981;
      box-shadow: 0 0 0 3.5px rgba(16, 185, 129, 0.14);
    }

    .form-input.border-red-500 {
      border-color: #ef4444 !important;
      background-color: #fef2f2 !important;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12) !important;
    }

    .error-msg {
      font-size: 11.5px;
      color: #ef4444;
      font-weight: 600;
      margin-top: 2px;
    }

    .hidden {
      display: none !important;
    }

    .btn-submit {
      width: 100%;
      padding: 12px 18px;
      border-radius: 11px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 6px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-1.5px);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
    }

    .btn-submit:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.2);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-footer {
      text-align: center;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
      font-size: 11.5px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="logo-badge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.29 7 12 12 20.71 7"/>
          <line x1="12" y1="22" x2="12" y2="12"/>
        </svg>
      </div>
      <h2 class="login-title">Auto Fill System</h2>
      <p class="login-subtitle">Đăng nhập tài khoản quản trị để tiếp tục</p>
    </div>
    
    <form id="login-form" style="display: flex; flex-direction: column; gap: 14px;" novalidate>
      <div class="form-group">
        <label class="form-label" for="login-email">Tên đăng nhập hoặc Email (*)</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="login-email" placeholder="yen_admin hoặc name@company.com" class="form-input" required autocomplete="username">
        </div>
        <p id="error-email" class="error-msg hidden"></p>
      </div>

      <div class="form-group">
        <div class="form-label-row">
          <label class="form-label" for="login-password">Mật khẩu (*)</label>
          <a class="form-link" id="link-forgot-password">Quên mật khẩu?</a>
        </div>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="login-password" placeholder="••••••••" class="form-input" required autocomplete="current-password">
        </div>
        <p id="error-password" class="error-msg hidden"></p>
      </div>

      <button type="submit" id="login-submit-btn" class="btn-submit">
        <span>🔑 Đăng nhập hệ thống</span>
      </button>
    </form>
    
    <div class="login-footer">
      <span>Dùng chung tài khoản với Extension Options</span>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="auth.session.js"></script>
  <script src="auth.service.js"></script>
  <script src="login.js"></script>
</body>
</html>
